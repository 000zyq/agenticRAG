name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.10"
      - name: Install test and collection dependencies
        run: |
          uv venv --python 3.11
          uv pip install --python .venv/bin/python pytest pypdf ruff fastapi httpx python-dotenv \
            'psycopg[binary]' openai python-docx pymilvus tiktoken
      - name: Run lint
        run: uv run --no-sync python -m ruff check .
      - name: Run tests (non-integration)
        run: uv run --no-sync python -m pytest -m "not integration"
